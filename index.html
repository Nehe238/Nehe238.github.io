<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시연영상 보기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --border: #2a2a32;
      --accent: #5b6aff;
      --accent-glow: rgba(91,106,255,0.22);
      --text: #e8e8f0;
      --muted: #7a7a92;
      --mono: 'Space Mono', monospace;
      --sans: 'Noto Sans KR', sans-serif;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 25% 30%, rgba(91,106,255,0.08) 0%, transparent 55%),
        radial-gradient(circle at 75% 70%, rgba(91,106,255,0.05) 0%, transparent 50%);
      pointer-events: none;
    }
    .card {
      position: relative;
      width: min(460px, 92vw);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 52px 44px 44px;
      text-align: center;
      animation: rise 0.55s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes rise {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .play-ring {
      width: 72px; height: 72px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: var(--accent-glow);
      border: 1.5px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 28px var(--accent-glow);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 20px var(--accent-glow); }
      50%      { box-shadow: 0 0 42px rgba(91,106,255,0.38); }
    }
    .play-ring svg { width:28px; height:28px; fill:var(--accent); transform:translateX(2px); }
    .label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 { font-size:26px; font-weight:700; letter-spacing:-0.02em; line-height:1.25; margin-bottom:10px; }
    .sub { font-size:14px; color:var(--muted); font-weight:300; margin-bottom:36px; line-height:1.6; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 32px;
      background: var(--accent);
      color: #fff;
      font-family: var(--sans);
      font-size: 15px; font-weight: 700;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.18s, transform 0.12s;
      letter-spacing: 0.01em;
    }
    .btn:hover { background: #6f7dff; transform: translateY(-2px); }
    .btn svg { width:17px; height:17px; fill:#fff; flex-shrink:0; }
    .divider {
      display:flex; align-items:center; gap:12px;
      margin: 24px 0;
    }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .divider span { font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:0.1em; }
    .url-text { font-family:var(--mono); font-size:11px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="play-ring">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="label">Demo Video</div>
    <h1>시연영상</h1>
    <p class="sub">버튼을 클릭하면 YouTube로 이동합니다</p>
    <a class="btn" href="https://youtu.be/TvAe6-ofpoY" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      영상 보기
    </a>
    <div class="divider"><span>link</span></div>
    <p class="url-text">youtu.be/TvAe6-ofpoY</p>
  </div>
</body>
</html>
