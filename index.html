<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>웹 이미지 추출 & PDF 생성기</title>
  <!-- jsPDF 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f7f9fa; padding: 16px; color: #333; }
    .container { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
    p.desc { font-size: 0.85rem; color: #666; margin-bottom: 20px; line-height: 1.4; }
    
    .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    input[type="url"] { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    input[type="url"]:focus { border-color: #0070f3; }
    
    .btn { width: 100%; padding: 14px; background: #0070f3; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn:active { background: #0056b3; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn-pdf { background: #10b981; margin-top: 16px; display: none; }
    .btn-pdf:active { background: #059669; }
    
    #status { margin-top: 14px; font-size: 0.85rem; text-align: center; color: #555; }
    
    .preview-header { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; margin-bottom: 10px; font-size: 0.9rem; font-weight: 600; }
    .image-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 380px; overflow-y: auto; padding: 4px; }
    .img-card { position: relative; border-radius: 8px; overflow: hidden; border: 2px solid transparent; background: #eee; aspect-ratio: 1; }
    .img-card.selected { border-color: #0070f3; }
    .img-card img { width: 100%; height: 100%; object-fit: cover; }
    .img-card input[type="checkbox"] { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; accent-color: #0070f3; }
  </style>
</head>
<body>

<div class="container">
  <h1>웹 이미지 PDF 변환기</h1>
  <p class="desc">링크를 입력하면 배너/아이콘을 제외한 본문 이미지만 골라내어 PDF로 묶어줍니다.</p>

  <div class="input-group">
    <input type="url" id="urlInput" placeholder="https://example.com" />
    <button class="btn" id="extractBtn" onclick="extractImages()">이미지 추출하기</button>
  </div>

  <div id="status"></div>

  <div id="resultArea" style="display: none;">
    <div class="preview-header">
      <span id="imgCount">추출된 이미지 (0장)</span>
      <span style="font-size: 0.8rem; color: #888;">터치하여 선택/해제</span>
    </div>
    <div class="image-grid" id="imageGrid"></div>
    <button class="btn btn-pdf" id="pdfBtn" onclick="generatePDF()">선택한 이미지 PDF 다운로드</button>
  </div>
</div>

<script>
  let loadedImages = [];

  // 배너, 아이콘, 광고 필터링 규칙
  const IGNORE_PATTERNS = [
    'banner', 'ad_', 'ads', 'icon', 'logo', 'badge', 'btn', 'button', 
    'thumb_small', 'favicon', 'avatar', 'profile', 'pixel', 'tracker', '1x1'
  ];

  async function extractImages() {
    const url = document.getElementById('urlInput').value.trim();
    const status = document.getElementById('status');
    const grid = document.getElementById('imageGrid');
    const extractBtn = document.getElementById('extractBtn');
    const resultArea = document.getElementById('resultArea');
    const pdfBtn = document.getElementById('pdfBtn');

    if (!url || !url.startsWith('http')) {
      alert('올바른 URL(http/https 포함)을 입력해주세요.');
      return;
    }

    extractBtn.disabled = true;
    status.innerText = '웹페이지를 분석하고 이미지를 찾는 중...';
    grid.innerHTML = '';
    resultArea.style.display = 'none';
    loadedImages = [];

    try {
      // CORS 우회 프록시 활용
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
      const res = await fetch(proxyUrl);
      const data = await res.json();
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(data.contents, 'text/html');
      
      const imgElements = Array.from(doc.querySelectorAll('img'));
      const rawSrcs = imgElements.map(img => {
        let src = img.getAttribute('data-src') || img.getAttribute('data-original') || img.getAttribute('src') || '';
        try {
          return new URL(src, url).href; // 상대경로를 절대경로로 변환
        } catch (e) {
          return null;
        }
      }).filter(src => !!src && !src.startsWith('data:image/svg'));

      // 중복 및 키워드 필터링
      const filteredUrls = [...new Set(rawSrcs)].filter(imgUrl => {
        const lower = imgUrl.toLowerCase();
        return !IGNORE_PATTERNS.some(pattern => lower.includes(pattern));
      });

      status.innerText = `이미지 ${filteredUrls.length}개 검수 중...`;

      // 실제 이미지 로딩 및 해상도 필터 (200px 미만 배너/아이콘 제외)
      for (const imgUrl of filteredUrls) {
        const proxiedImg = `https://api.allorigins.win/raw?url=${encodeURIComponent(imgUrl)}`;
        await new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = 'Anonymous';
          img.onload = () => {
            if (img.naturalWidth >= 200 && img.naturalHeight >= 200) {
              loadedImages.push({ element: img, src: proxiedImg, width: img.naturalWidth, height: img.naturalHeight });
            }
            resolve();
          };
          img.onerror = () => resolve();
          img.src = proxiedImg;
        });
      }

      if (loadedImages.length === 0) {
        status.innerText = '가져올 수 있는 본문 이미지가 없습니다. (JS 렌더링 사이트 또는 보안 차단)';
        extractBtn.disabled = false;
        return;
      }

      status.innerText = '';
      resultArea.style.display = 'block';
      pdfBtn.style.display = 'block';
      document.getElementById('imgCount').innerText = `선택된 이미지 (${loadedImages.length}장)`;

      // 화면에 이미지 프리뷰 카드 렌더링
      loadedImages.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'img-card selected';
        card.innerHTML = `
          <input type="checkbox" checked id="chk_${index}">
          <img src="${item.src}">
        `;
        card.onclick = (e) => {
          if (e.target.tagName !== 'INPUT') {
            const chk = card.querySelector('input');
            chk.checked = !chk.checked;
          }
          card.classList.toggle('selected', card.querySelector('input').checked);
        };
        grid.appendChild(card);
      });

    } catch (err) {
      status.innerText = '페이지를 불러오지 못했습니다. 사이트 주소를 확인해주세요.';
    } finally {
      extractBtn.disabled = false;
    }
  }

  async function generatePDF() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pdfBtn = document.getElementById('pdfBtn');
    const status = document.getElementById('status');

    const selectedIndices = [];
    loadedImages.forEach((_, idx) => {
      const chk = document.getElementById(`chk_${idx}`);
      if (chk && chk.checked) selectedIndices.push(idx);
    });

    if (selectedIndices.length === 0) {
      alert('PDF로 만들 이미지를 1개 이상 선택해주세요.');
      return;
    }

    pdfBtn.disabled = true;
    status.innerText = 'PDF 문서 생성 중...';

    const pageWidth = 210; // A4 가로 (mm)
    const pageHeight = 297; // A4 세로 (mm)
    const margin = 10;
    const maxWidth = pageWidth - (margin * 2);
    const maxHeight = pageHeight - (margin * 2);

    for (let i = 0; i < selectedIndices.length; i++) {
      if (i > 0) pdf.addPage();

      const item = loadedImages[selectedIndices[i]];
      const canvas = document.createElement('canvas');
      canvas.width = item.width;
      canvas.height = item.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(item.element, 0, 0);

      const imgData = canvas.toDataURL('image/jpeg', 0.85);

      // 비율 계산 (A4 안에 꽉 차게 맞춤)
      const ratio = Math.min(maxWidth / item.width, maxHeight / item.height);
      const renderW = item.width * ratio;
      const renderH = item.height * ratio;
      const posX = (pageWidth - renderW) / 2;
      const posY = (pageHeight - renderH) / 2;

      pdf.addImage(imgData, 'JPEG', posX, posY, renderW, renderH);
    }

    pdf.save('extracted_images.pdf');
    status.innerText = '다운로드가 완료되었습니다!';
    pdfBtn.disabled = false;
  }
</script>

</body>
</html>
