<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>창의적 공학설계 중간고사 연습</title>
<style>
:root{color-scheme:light;--paper:#f5f5ef;--white:#fff;--ink:#182b25;--muted:#52665c;--line:#dbe2d8;--green:#174b39;--light:#e9f3e8;--red:#9b3529}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.wrap{width:min(1110px,calc(100% - 40px));margin:auto}.hero{background:#143c30;color:#fff;padding:38px 0 34px}.hero p{margin:8px 0 0;color:#d8e7dc}.hero h1{font-size:clamp(1.65rem,4vw,2.7rem);line-height:1.2;margin:8px 0 12px;letter-spacing:-.055em}.kicker{color:#c1dfa7;font-weight:700;font-size:.86rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:22px;align-items:start;margin:24px auto 40px}.card,.side,.result{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:26px}.side{position:sticky;top:16px;padding:20px}.side h2,.result h2{margin:0;font-size:1.12rem}.side p{margin:7px 0}.muted{color:var(--muted);font-size:.89rem}.row,.actions,.timer{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.spread{justify-content:space-between}.actions{margin-top:24px}.tag{font-size:.82rem;color:var(--green);background:var(--light);padding:3px 9px;border-radius:5px;font-weight:700}.number{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}.prompt{font-size:clamp(1.16rem,2.5vw,1.55rem);line-height:1.55;margin:15px 0 22px;letter-spacing:-.035em}.choices{display:grid;gap:9px}.choice{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;cursor:pointer}.choice:has(input:checked){background:var(--light);border-color:var(--green)}input[type=radio]{margin:6px 1px;accent-color:var(--green)}input[type=text],textarea{width:100%;padding:12px;border:1px solid #aab9ad;border-radius:8px;color:var(--ink);font:inherit;background:#fff}textarea{min-height:165px;resize:vertical}input:disabled,textarea:disabled{opacity:1;color:var(--ink);background:#f8faf7}
button{font:inherit;font-weight:700;color:var(--green);background:#fff;border:1px solid #b9c8ba;border-radius:8px;padding:8px 13px;cursor:pointer}button:hover:not(:disabled){background:var(--light)}button.primary{background:var(--green);color:#fff;border-color:var(--green)}button.primary:hover{background:#23624c}button:disabled{opacity:.42;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #37896a;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:12px 0 10px}.grid button{padding:5px 0;font-size:.82rem}.grid .filled,.grid .correct{background:var(--light)}.grid .wrong{background:#fbece7;color:var(--red)}.grid [aria-current=true]{outline:2px solid var(--green);outline-offset:1px}
progress{display:block;width:100%;height:8px;accent-color:var(--green)}.timer{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;justify-content:space-between}.timer span{font-weight:700;font-variant-numeric:tabular-nums}.timer button{font-size:.79rem;padding:4px 8px}.feedback{margin-top:20px;padding:15px 17px;border-radius:9px;background:#f2f6ef;border-left:4px solid #5d8d71}.feedback.wrong{background:#fcf1ec;border-color:#b45947}.feedback p{margin:6px 0;white-space:pre-wrap}.feedback ul{margin:6px 0;padding-left:22px}.result{margin-bottom:14px;padding:19px 24px}.result p{margin:5px 0 12px}.result select{font:inherit;color:var(--green);padding:8px;border:1px solid #b9c8ba;border-radius:8px;background:#fff}.full{width:100%;margin-top:10px}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:14px;padding:24px;width:min(430px,calc(100% - 32px));color:var(--ink)}dialog::backdrop{background:#10291db0}dialog h2{margin:0}
@media(max-width:750px){.layout{grid-template-columns:1fr;margin-top:16px}.side{position:static}.hero{padding:25px 0}.wrap{width:calc(100% - 26px)}.card{padding:19px}.grid{grid-template-columns:repeat(10,minmax(0,1fr))}}
.source{display:grid;gap:3px;margin-top:20px;padding:12px 14px;background:#f6f8f3;border:1px solid var(--line);border-radius:8px;overflow-wrap:anywhere}.source strong{color:var(--green)}
.mode{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.mode button[aria-pressed="true"]{background:#c1dfa7;border-color:#c1dfa7;color:#143c30}.mode-note{font-size:.9rem}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
<div class="kicker">교재 1–7장 · 이론시험 대비</div>
<h1>창의적 공학설계 중간고사 연습</h1>
<p>정리본과 OX를 바탕으로 만든 예상문제 38문항</p>
<p>출처의 쪽수는 정리본 PDF 뷰어 기준입니다.</p>
<p>객관식 22 · 단답형 12 · 주관식 2 · 서술형 2</p>
<nav class="mode" aria-label="풀이 모드">
<button id="studyMode" aria-pressed="false">학습 모드</button>
<button id="examMode" aria-pressed="true">모의고사 모드</button>
</nav>
<p id="modeNote" class="mode-note"></p>
</div></header>
<main class="wrap layout">
<div>
<section id="result" class="result" aria-labelledby="result-title" hidden>
<h2 id="result-title">채점 결과</h2><p id="score"></p>
<div class="row"><select id="filter" aria-label="검토할 문항"><option value="all">전체 문항</option><option value="wrong">오답·미응답</option><option value="written">주관식·서술형</option></select><button id="retry">오답만 다시 풀기</button></div>
</section>
<section class="card" aria-labelledby="prompt">
<div class="row spread"><div class="row"><span id="kind" class="tag"></span><span id="chapter" class="muted" hidden></span></div><span id="number" class="number"></span></div>
<h2 id="prompt" class="prompt" tabindex="-1"></h2>
<div id="answer"></div>
<p id="shortcut" class="muted" hidden></p>
<div id="source" class="source muted" aria-label="문항 출처" hidden></div>
<div id="feedback" class="feedback" aria-live="polite" hidden></div>
<div class="actions spread"><button id="prev">← 이전</button><button id="check" hidden>정답·해설 보기</button><button id="next" class="primary">다음 →</button></div>
</section>
</div>
<aside class="side" aria-labelledby="nav-title">
<h2 id="nav-title">문항 이동</h2>
<p id="status" class="muted"></p><progress id="progress" aria-label="응답 진행률"></progress>
<nav id="grid" class="grid" aria-label="문항 번호"></nav>
<p id="legend" class="muted"></p>
<div class="timer" id="timerRow"><span id="time">50:00</span><button id="timer" aria-label="50분 타이머 시작">타이머 시작</button></div>
<p id="timeNote" class="muted" aria-live="polite">타이머는 선택 사항입니다.</p>
<button id="submit" class="primary full">제출하고 채점</button>
<button id="reset" class="full">전체 다시 풀기</button>
<p id="storageNote" class="muted"></p>
</aside>
</main>
<dialog id="confirm"><form method="dialog"><h2 id="dialogTitle"></h2><p id="dialogBody"></p><div class="row spread"><button value="cancel" autofocus>취소</button><button class="primary" value="ok">확인</button></div></form></dialog>
<script>
"use strict";
const sourceFile = "10주차_중간고사대비 정리(교재1-7장)_학생용.pdf";
const bank = [{"ch":"1","p":"7","q":"공학이 실용적 가치를 유지하기 위해 충족해야 하는 세 요건은?","a":["경제성·편의성·정교성","실현 가능성·시장성·독창성","실현 가능성·경제성·윤리성","창의성·신속성·심미성"],"b":2,"e":"정리본은 필요성과 현실성에 해당하는 실현 가능성, 경제성, 윤리성을 제시한다.","t":"객관식","topic":"공학의 실용적 가치와 세 요건"},{"ch":"1","p":"3–4","q":"과학자와 공학자의 역할을 수업 내용에 맞게 설명한 것은?","a":["과학자는 지식을 실용화하고, 공학자는 자연의 법칙을 발견하는 데 주력한다.","과학자는 지식을 체계화하고, 공학자는 지식을 실용적 문제 해결에 적용한다.","과학자와 공학자의 소임은 모두 실용적인 결과물 구현에 한정된다.","과학자는 제품 구현을, 공학자는 자연 현상 기록을 주로 맡는다."],"b":1,"e":"과학자의 소임은 아는 것(to know), 공학자의 소임은 하는 것(to do)으로 요약된다.","t":"객관식","topic":"공학의 정의와 과학자·공학자의 소임"},{"ch":"2","p":"23","q":"부품을 어떤 방법과 순서로 제작하는지 현장 작업자가 확인할 때 적절한 결과물은?","a":["품질보증서","공학적 해석 결과","시험 평가 보고서","공정도"],"b":3,"e":"공정도는 작업 및 제조 방법과 순서를 나타낸다.","t":"객관식","topic":"공학설계 결과물 중 공정도"},{"ch":"2","p":"24–25, 33","q":"시제품을 시험하니 사용자가 다칠 위험이 발견됐다. 공학설계의 특성에 부합하는 대응은?","a":["위험을 현실적 제한 조건으로 다루고 필요하면 앞 단계로 돌아가 설계를 수정한다.","안전성은 설계가 끝난 후 홍보 단계에서 검토한다.","시험 절차를 재실행하고 기존 설계는 그대로 유지한다.","도면이 완성됐으므로 평가 결과만 보고서에 남긴다."],"b":0,"e":"공학설계는 상호 의존적인 반복 과정이다. 안전성은 현실적 제한 조건 중 하나다.","t":"객관식","topic":"공학설계의 반복성·현실적 제한 조건과 OX"},{"ch":"2","p":"28","q":"정리본에 제시된 디자인 씽킹 5단계 순서는?","a":["문제 정의 → 아이디어 도출 → 공감 → 시제품 제작 → 시험 및 검증","공감 → 아이디어 도출 → 문제 정의 → 시험 및 검증 → 시제품 제작","문제 정의 → 공감 → 시제품 제작 → 아이디어 도출 → 시험 및 검증","공감 → 문제 정의 → 아이디어 도출 → 시제품 제작 → 시험 및 검증"],"b":3,"e":"사용자에 대한 공감에서 출발해 문제를 정의하고, 아이디어를 시제품으로 만들어 시험한다.","t":"객관식","topic":"스탠퍼드 D스쿨 디자인 씽킹 5단계"},{"ch":"2","p":"29–30","q":"여러 아이디어를 도출한 뒤 평가·선정하고, 선택한 최적해를 구체화했다. 창의적 공학설계의 어느 단계인가?","a":["문제 인식","개념 설계","평가","아이디어 구현"],"b":1,"e":"개념 설계는 아이디어 도출, 평가·선정, 최적해 구체화를 포함한다. 아이디어 구현 단계에서는 상세 설계, 제작 및 시험을 수행한다.","t":"객관식","topic":"창의적 공학설계 프로세스와 단계별 주요 업무"},{"ch":"3","p":"36–39, 44–45","q":"아이디어를 제안하자마자 팀원이 ‘말이 안 된다’며 평가했다. 진행자가 직접 상기시킬 규칙은?","a":["자유분방","비판 금지","질보다 양","결합과 개선"],"b":1,"e":"아이디어를 도출하는 동안에는 즉각적인 비판을 피하고 판단은 평가 단계로 미룬다.","t":"객관식","topic":"브레인스토밍의 기본 원리와 네 규칙 및 OX"},{"ch":"3","p":"46, 50","q":"우산을 개선하기 위해 무작위로 고른 ‘아코디언’에서 접히는 구조를 연상했다. 적용한 발상 도구는?","a":["하이라이팅","평가 행렬표","PMI","강제 연결법"],"b":3,"e":"서로 관련 없어 보이는 대상의 특징이나 기능을 연결해 새로운 아이디어를 얻는 방법이다.","t":"객관식","topic":"강제 연결법의 개념과 OX"},{"ch":"3","p":"52–56","q":"하이라이팅에서 유망한 아이디어를 히트로 골랐다. 연관된 히트를 묶어 만든 그룹의 이름은?","a":["제한 조건","적중 영역","문제 정의문","평가 준거"],"b":1,"e":"서로 관련된 히트를 묶은 그룹이 적중 영역(cluster)이다.","t":"객관식","topic":"하이라이팅의 히트·적중 영역과 적용 사례"},{"ch":"3","p":"58–62, 64","q":"A팀은 아이디어 하나의 장점·단점·흥미로운 점을 기록한다. B팀은 대안 네 개를 공통 기준으로 점수화한다. 도구를 순서대로 고르면?","a":["강제 연결법 → 하이라이팅","평가 행렬표 → PMI","하이라이팅 → 브레인스토밍","PMI → 평가 행렬표"],"b":3,"e":"PMI는 한 아이디어를 집중 분석할 때 효과적이다. 평가 행렬표는 여러 대안을 동일한 준거로 점수화해 비교한다.","t":"객관식","topic":"PMI·평가 행렬표의 개념과 수렴적 사고 OX"},{"ch":"4","p":"67–69, 72","q":"팀워크의 장점과 위험을 올바르게 짝지은 것은?","a":["장점은 의견의 획일화, 위험은 역할 명료화","장점은 다양한 전문성 활용, 위험은 집단 사고","장점은 책임 분산, 위험은 전문성 공유","장점은 의견 충돌 방치, 위험은 협업을 통한 지식 공유"],"b":1,"e":"다양한 전문성은 해결책의 폭을 넓힌다. 집단 사고는 팀 활동에서 경계해야 할 위험이다.","t":"객관식","topic":"팀워크의 장단점·핵심 요소와 OX"},{"ch":"4","p":"69–70","q":"회의가 끝날 때마다 누가 무엇을 맡았는지 혼동한다. 가이드라인에 맞는 조치는?","a":["이견이 나올 때는 목표와 일정 기록을 보류한다.","각자의 임무는 다음 회의를 열 때마다 처음부터 결정한다.","팀장만 결론을 기록하고 다음 회의에서 구두로 설명한다.","회의 종료 전에 각자 임무와 다음 일정을 확인하고 회의록을 공유한다."],"b":3,"e":"종료 전 결론과 각자 임무 및 다음 일정을 확인하고 회의록을 공유한다.","t":"객관식","topic":"팀워크의 핵심 요소와 팀 회의 가이드라인"},{"ch":"4","p":"73–78","q":"마인드맵의 작성 방식과 사고 유형을 맞게 연결한 것은?","a":["근본 원인을 빈도순으로 정리하는 수렴적 사고","대안을 공통 기준으로 점수화하는 수렴적 사고","핵심 개념에서 관련 가지를 뻗는 발산적 사고","질문을 반복해 원인을 좁히는 발산적 사고"],"b":2,"e":"마인드맵은 중심 개념에서 연관 아이디어를 확장하고 이미지, 색상, 핵심 단어를 활용한다.","t":"객관식","topic":"마인드맵의 개념·특징과 OX"},{"ch":"5","p":"81–83, 89","q":"실습실 입장 대기 시간이 15분이고 목표가 5분이다. 문제를 인식하는 데 필요한 판단은?","a":["해결책이 정해져야 비로소 현재와 목표를 비교할 수 있다.","현재와 목표의 차이가 있고 그 차이를 해결할 문제로 인식한다.","기준을 15분으로 조정하면 원인이 자동으로 해결된다.","현재 값만 측정하면 목표와의 차이는 확인할 필요가 없다."],"b":1,"e":"현재와 목표의 격차는 10분이다. 그 차이를 문제로 인식해야 해결을 시작할 수 있다.","t":"객관식","topic":"문제와 문제 인식의 정의 및 OX"},{"ch":"5","p":"90–94, 96","q":"교내 자전거를 기준 시스템으로 볼 때, 현재 자전거 내부의 브레이크 부품을 점검하는 창은?","a":["과거의 하위 시스템","현재의 상위 시스템","현재의 하위 시스템","미래의 상위 시스템"],"b":2,"e":"부품은 자전거를 구성하는 하위 시스템이며, 점검 시점은 현재다.","t":"객관식","topic":"시스템 사고의 시간·수준 구분과 OX"},{"ch":"5","p":"83, 86–87","q":"‘장비 반납 누락을 줄이기 위해 반납 기록 절차를 개선하자’에서 목적(why)은?","a":["장비 반납 누락이 발생하는 장소","반납 기록 절차 그 자체","반납 기록 절차를 개선하는 것","장비 반납 누락을 줄이는 것"],"b":3,"e":"‘왜 하는가’에 대한 답은 반납 누락 감소이며 ‘무엇을 하는가’는 반납 기록 절차의 개선이다.","t":"객관식","topic":"문제 발견·정의와 인식된 문제 정의문의 형식"},{"ch":"6","p":"98–99","q":"넓은 의미의 문제 정의에서 진짜 문제를 정의한 후 이어지는 활동은?","a":["문제 점검","제품 평가","발명 원리 선택","아이디어 구현"],"b":0,"e":"문제 점검은 정의한 문제가 해결할 가치가 있는지, 현실 조건에서 해결할 수 있는지를 살피는 과정이다.","t":"객관식","topic":"넓은 의미의 문제 정의와 문제 점검"},{"ch":"6","p":"100–104","q":"고장 원인별 발생 건수가 있다. 자주 발생하는 핵심 원인을 우선 해결하고 싶을 때 적절한 도구는?","a":["원인-결과 도표","시스템 사고","5 Whys","파레토 도표"],"b":3,"e":"파레토 도표는 원인을 주로 빈도순으로 정리해 우선순위를 보여 준다. 80:20은 핵심 원인에 집중하는 원리다.","t":"객관식","topic":"근본 원인 분석 도구 중 파레토 도표와 OX"},{"ch":"6","p":"106–112","q":"보호 케이스의 두께를 늘리면 내충격성은 좋아지지만 휴대성은 떨어진다. 이 모순을 내충격성과 휴대성의 관계로 표현할 때 분류는?","a":["기술적 모순","시간 분리","물리적 모순","문제 점검"],"b":0,"e":"기술적 모순은 서로 다른 두 특성 사이의 충돌이다. 여기서는 내충격성과 휴대성이 충돌한다.","t":"객관식","topic":"기술적 모순과 물리적 모순의 구분"},{"ch":"7","p":"116–118","q":"SCAMPER에서 7개 문자가 9가지 질문으로 이어지는 이유는?","a":["7개 문자 외에 두 문자를 새로 추가해서","9개 질문 중 두 개가 결과 채점용이어서","대체와 결합을 질문에서 제외해서","M, E 등이 복수의 변형 방향을 담고 있어서"],"b":3,"e":"정리본은 M에서 변경과 확대, E에서 제거와 축소를 구분해 총 9가지 질문을 제시한다.","t":"객관식","topic":"스캠퍼의 개념, 9가지 질문과 OX"},{"ch":"7","p":"119–121","q":"같은 작업용 장갑에서 손바닥에는 미끄럼 방지 재료를, 손등에는 통기성 재료를 적용했다. 부위마다 다른 성질을 부여하는 발명 원리는?","a":["유익한 조치의 연속","주기적 작동","국소적 성질","사전 완충조치"],"b":2,"e":"국소적 성질은 전체를 균일하게 구성하는 대신 각 부위의 기능과 조건에 맞는 성질을 부여하는 원리다.","t":"객관식","topic":"트리즈 40가지 발명 원리 중 국소적 성질과 OX"},{"ch":"7","p":"122–123","q":"한 조리 도구의 손잡이는 열을 전달하지 않고 음식에 닿는 끝부분은 열을 잘 전달해야 한다. 위치에 따라 두 요구를 충족하는 분리 원리는?","a":["주기적 작동","시간 분리","공간 분리","조건 분리"],"b":2,"e":"손잡이와 끝부분이라는 서로 다른 위치에 상반된 열전달 특성을 부여하는 공간 분리의 사례다.","t":"객관식","topic":"물리적 모순에 적용하는 공간 분리와 OX"},{"ch":"1","p":"9","q":"길포드가 정의한 창의성의 네 요소를 모두 쓰시오.","a":"유연성, 유창성, 독창성, 정교성","b":[["유연성","융통성"],["유창성"],["독창성"],["정교성"]],"e":"네 요소의 순서는 관계없다.","t":"단답형","topic":"길포드가 정의한 창의성의 네 요소"},{"ch":"1","p":"7","q":"공학자 집단이 공유하는 고유한 윤리 기준인 공학윤리는 일반윤리·직업윤리·전문윤리 중 어느 범주에 해당하는가?","a":"전문윤리","b":[["전문윤리"]],"e":"공학윤리와 의료윤리는 특정 직업 집단의 전문윤리 사례다.","t":"단답형","topic":"공학윤리와 일반윤리·직업윤리·전문윤리의 구분"},{"ch":"2","p":"29–30, 33","q":"창의적 공학설계에서 미처 문제로 보지 않았던 현상을 새롭게 문제로 보는 첫 단계의 이름을 쓰시오.","a":"문제 인식","b":[["문제인식","문제인식단계"]],"e":"창의적 공학설계는 출발점인 문제 인식과 창의적 발상 도구의 활용을 강조한다.","t":"단답형","topic":"창의적 공학설계의 문제 인식 단계와 OX"},{"ch":"3","p":"39, 44","q":"동료의 아이디어에 편승해 서로 합치거나 더 나은 형태로 바꿨다. 브레인스토밍의 네 규칙 중 무엇인가?","a":"결합과 개선","b":[["결합과개선","결합및개선","결합개선","편승","히치하이킹"]],"e":"다른 아이디어를 경청하고 결합하거나 발전시키는 규칙이다.","t":"단답형","topic":"브레인스토밍의 결합과 개선 및 편승"},{"ch":"3","p":"51","q":"다양한 아이디어를 분류·분석·평가하여 적합한 해결안을 고르는 사고 방식은?","a":"수렴적 사고","b":[["수렴적사고","수렴사고"]],"e":"발산적 사고로 선택지를 넓히고 수렴적 사고로 평가해 선택한다.","t":"단답형","topic":"발산적 사고와 수렴적 사고의 개념"},{"ch":"4","p":"71–72","q":"프로젝트의 각 업무 시작과 종료 시점을 시간축에 막대로 표시하는 일정 관리 도구의 이름을 쓰시오.","a":"간트 차트","b":[["간트차트","간트챠트","간트도표","ganttchart"]],"e":"시간축의 막대로 각 작업의 시작과 종료를 한눈에 확인할 수 있다.","t":"단답형","topic":"프로젝트 일정 관리의 간트 차트와 OX"},{"ch":"4","p":"73–78","q":"중심 주제에서 가지를 뻗고 이미지, 색상, 핵심 단어로 연관 내용을 정리하는 도구의 이름을 쓰시오.","a":"마인드맵","b":[["마인드맵","mindmap"]],"e":"마인드맵은 아이디어 도출과 학습 내용 정리 모두에 활용할 수 있다.","t":"단답형","topic":"마인드맵의 개념·특징과 OX"},{"ch":"5","p":"90–93","q":"시스템 사고의 9개 창에서 시간 축의 세 구분을 모두 쓰시오.","a":"과거, 현재, 미래","b":[["과거"],["현재"],["미래"]],"e":"시간 축 세 구분과 시스템 수준 세 구분을 조합해 9개의 창을 만든다.","t":"단답형","topic":"시스템 사고의 시간 구분과 9개 창"},{"ch":"5","p":"84","q":"수요자 관점이 문제 발견에 해당한다면, 공급자 관점에서 새로운 문제를 만들어 내는 유형은 무엇인가?","a":"문제 창안","b":[["문제창안","문제창안관점","창안"]],"e":"자료는 문제 인식을 문제 발견 관점과 문제 창안 관점으로 구분한다.","t":"단답형","topic":"문제 인식 유형 구분 도식"},{"ch":"6","p":"100, 104","q":"‘왜?’라는 질문과 답변을 반복해 근본 원인에 다가가는 방법의 이름을 쓰시오.","a":"5 Whys","b":[["5whys","5why","파이브와이즈","파이브와이","왜왜분석"]],"e":"질문 횟수는 상황에 따라 달라질 수 있다. 근본 원인에 도달하는 것이 목적이다.","t":"단답형","topic":"5 Whys의 개념과 근본 원인 분석 OX"},{"ch":"6","p":"102–104","q":"오른쪽 머리에 문제를 적고 등뼈에 여러 원인을 배치하는 도표를 쓰시오.","a":"원인-결과 도표","b":[["원인결과도표","원인결과다이어그램","생선뼈도표","생선뼈다이어그램","이시가와도표","이시카와도표","fishbonediagram","causeandeffectdiagram"]],"e":"원인-결과 도표는 여러 원인과 결과의 관계를 체계적으로 나타낸다.","t":"단답형","topic":"원인-결과 도표의 개념·작성과 OX"},{"ch":"7","p":"117–118","q":"SCAMPER에서 제품의 재료를 유리에서 실리콘으로 바꾸는 ‘대체’에 해당하는 알파벳 또는 영어 명칭을 쓰시오.","a":"S (Substitute)","b":[["s","substitute","대체","대체하기","ssubstitute","s대체"]],"e":"S는 Substitute다. 자료는 ‘다른 것으로 대체하면 어떨까?’를 예시 질문으로 제시한다.","t":"단답형","topic":"스캠퍼의 문자별 질문 중 S와 OX"},{"ch":"3","p":"58–61","q":"주관식 · 실습실에 QR 장비 대여 기록을 도입하려 한다. 이 아이디어를 PMI로 분석해 각 항목을 하나씩 쓰시오.","a":"P: 종이 장부를 찾는 시간이 줄어든다. M: 휴대전화나 네트워크에 문제가 있으면 현장에서 기록하기 어렵다. I: 반납 시각과 연결하면 자동 알림 기능으로 확장할 수 있다.","b":["P에 구체적인 장점","M에 구체적인 단점","I에 탐색할 만한 가능성 또는 흥미로운 점"],"t":"주관식","topic":"PMI의 세 분석 항목과 적용 순서"},{"ch":"5","p":"81–87","q":"주관식 · 실습 장비를 빌리는 데 평균 12분이 걸리며 목표는 5분 이하다. 현재와 목표의 차이를 쓰고, 목적(why)과 목표(what)가 드러나는 인식된 문제 정의문을 한 문장으로 작성하시오.","a":"목표 상한인 5분을 기준으로 현재 평균은 7분 초과한다. 실습 시작 지연을 줄이기 위해 장비 대여 절차를 개선하여 평균 대여 시간을 5분 이하로 줄이자.","b":["현재와 목표 상한의 차이 7분","왜 개선하는지 목적 제시","무엇을 달성할지 평균 5분 이하라는 목표 제시"],"t":"주관식","topic":"현재와 목표의 차이 및 인식된 문제 정의문"},{"ch":"6","p":"98–100","q":"서술형 · 수업마다 시작이 늦어진다. 확인 결과 공구를 찾는 데 오래 걸리고, 공구가 여러 곳에 흩어져 있으며, 지정된 반납 위치가 없다. ‘왜?’ 질문으로 증상부터 원인까지 연결하고, 진짜 문제와 문제 점검 항목을 각각 쓰시오.","a":"왜 시작이 늦는가? 공구를 찾는 데 오래 걸린다. 왜 찾기 어려운가? 공구가 흩어져 있다. 왜 흩어져 있는가? 지정된 반납 위치가 없다. 진짜 문제는 공구별 지정 반납 위치의 부재다. 공구 탐색 시간을 줄일 가치가 있는지, 현재 공간과 예산으로 반납 위치를 마련할 수 있는지 점검한다.","b":["증상에서 원인으로 이어지는 질문과 답변","지정 반납 위치 부재를 근본 원인으로 명시","해결 가치와 현실적 실행 가능성을 구체적으로 점검"],"t":"서술형","topic":"진짜 문제 정의, 문제 점검과 5 Whys"},{"ch":"7","p":"111–112, 122–123","q":"서술형 · 실습 장비 보호 덮개는 작업물을 교체할 때 열려야 하고, 기계가 가동되는 동안에는 닫혀야 한다. 모순의 유형과 충돌하는 값을 밝히고, 분리 원리와 적용 방법을 설명하시오.","a":"덮개의 개폐 상태라는 한 특성에 ‘열림’과 ‘닫힘’이 요구되는 물리적 모순이다. 시간 분리를 적용해 교체 시간에는 덮개를 열고 가동 시간에는 닫는다. 예를 들어 덮개가 닫힌 상태에서만 장비가 작동하도록 연동할 수 있다.","b":["한 특성의 상반된 값(열림/닫힘) 명시","물리적 모순과 시간 분리 식별","교체와 가동 시점별 적용 설명"],"t":"서술형","topic":"물리적 모순의 개념과 시간 분리","citation":"교재 6장 · PDF 111–112쪽(물리적 모순) / 교재 7장 · PDF 122–123쪽(시간 분리)"}];
const examKey = "engineering-midterm-2026-v1";
const studyKey = examKey + "-study";
let key = examKey;
let study = false;
const all = bank.map((_, index) => index);
const $ = id => document.getElementById(id);
const fresh = () => ({ids:all, responses:{}, current:0, submitted:false, deadline:0, remaining:3000000, revealed:{}});
let state = fresh();
let filter = "all";
let storage = true;
let pending;
const states = new Map();
function loadMode() {
  if (states.has(key)) return states.get(key);
  let loaded = fresh();
  try {
    const raw = localStorage.getItem(key);
    if (raw) loaded = JSON.parse(raw);
  } catch { storage = false; }
  states.set(key, loaded);
  return loaded;
}
state = loadMode();
function save() {
  states.set(key, state);
  if (!storage) return;
  try { localStorage.setItem(key, JSON.stringify(state)); }
  catch { storage = false; $("storageNote").textContent = "이 브라우저에서는 답안을 자동 저장할 수 없습니다."; }
}
const response = id => state.responses[id] ?? "";
const answered = id => response(id).trim() !== "";
const normalize = s => s.normalize("NFKC").toLowerCase().replace(/[^\p{L}\p{N}]/gu,"");
function correct(id) {
  const item = bank[id];
  const value = response(id).trim();
  if (!value) return false;
  if (item.t === "객관식") return value === String(item.b);
  if (item.t !== "단답형") return false;
  if (item.b.length === 1) return item.b[0].includes(normalize(value));
  const parts = value.split(/[\s,，、;·/|]+/u).map(normalize).filter(Boolean);
  return parts.length === item.b.length && item.b.every(group => group.some(alias => parts.includes(alias)));
}
const automatic = id => id < 34;
const mistakes = () => state.ids.filter(id => automatic(id) && !correct(id));
function visible() {
  if (!state.submitted || filter === "all") return state.ids;
  if (filter === "wrong") return mistakes();
  return state.ids.filter(id => !automatic(id));
}
function node(tag, value, className) {
  const el = document.createElement(tag);
  el.textContent = value;
  if (className) el.className = className;
  return el;
}
function jump(id) {
  state.current = id;
  save();
  render();
  const field = study && bank[id].t !== "객관식" && !state.revealed[id] ? $("answer").querySelector("input, textarea") : $("prompt");
  field.focus({preventScroll:true});
  $("prompt").scrollIntoView({block:"nearest"});
}
function stats() {
  const ids = visible();
  const done = state.ids.filter(answered).length;
  $("status").textContent = "응답 " + done + " / " + state.ids.length + "문항";
  $("progress").max = state.ids.length;
  $("progress").value = done;
  $("legend").textContent = state.submitted ? "초록은 정답, 붉은색은 오답·미응답" : "초록으로 표시된 번호는 응답한 문항입니다.";
  $("grid").replaceChildren(...ids.map(id => {
    const button = node("button", id + 1);
    button.type = "button";
    button.className = state.submitted && automatic(id) ? (correct(id) ? "correct" : "wrong") : (answered(id) && !state.submitted ? "filled" : "");
    button.setAttribute("aria-current", String(id === state.current));
    button.setAttribute("aria-label", (id + 1) + "번" + (state.submitted && automatic(id) ? (correct(id) ? ", 정답" : ", 오답 또는 미응답") : (answered(id) ? ", 응답 완료" : ", 미응답")));
    button.onclick = () => jump(id);
    return button;
  }));
}
function sourceInfo(id, item) {
  const panel = $("source");
  panel.hidden = !item;
  panel.replaceChildren();
  if (!item) return;
  panel.append(
    node("strong", "문항 출처 · " + (item.citation ?? ("교재 " + item.ch + "장 · PDF " + item.p + "쪽"))),
    node("span", "자료 · " + sourceFile),
    node("span", "근거 내용 · " + item.topic),
    node("span", "문항은 해당 내용을 바탕으로 재구성했습니다.")
  );
}
function feedback(id, item) {
  const box = $("feedback");
  const show = state.submitted || (study && state.revealed[id]);
  box.hidden = !show;
  box.replaceChildren();
  box.className = "feedback";
  if (!show) return;
  if (automatic(id)) {
    const ok = correct(id);
    box.classList.toggle("wrong", !ok && answered(id));
    box.append(node("strong", ok ? "정답" : answered(id) ? "오답" : study ? "정답 확인" : "미응답"),
      node("p", "정답 · " + (item.t === "객관식" ? item.a[item.b] : item.a)), node("p", item.e));
  } else {
    const list = document.createElement("ul");
    list.append(...item.b.map(point => node("li", point)));
    box.append(node("strong", "예시 답안"), node("p", item.a), node("strong", "자기 채점 기준"), list);
  }
  box.append(node("p", "근거 · " + (item.citation ?? ("교재 " + item.ch + "장 · PDF " + item.p + "쪽 · " + item.topic)), "muted"), node("p", automatic(id) ? "해설은 위 자료를 바탕으로 작성했습니다." : "예시 답안과 자기 채점 기준은 위 자료를 바탕으로 만든 연습용입니다.", "muted"));
}
function render() {
  const ids = visible();
  $("result").hidden = !state.submitted;
  $("submit").hidden = study || state.submitted;
  $("timerRow").hidden = study;
  $("timeNote").hidden = study;
  $("studyMode").setAttribute("aria-pressed", String(study));
  $("examMode").setAttribute("aria-pressed", String(!study));
  $("modeNote").textContent = study ? "한 문제씩 바로 채점하고 키보드로 다음 문제로 이동할 수 있습니다." : "38문항을 풀고 제출하면 전체 채점 결과를 볼 수 있습니다.";
  $("reset").textContent = study ? "학습 답안 초기화" : "전체 다시 풀기";
  $("reset").hidden = !state.submitted && !state.ids.some(answered) && !state.deadline && state.remaining === 3000000 && state.ids.length === all.length;
  $("filter").value = filter;
  if (state.submitted) {
    const auto = state.ids.filter(automatic);
    const written = state.ids.filter(id => !automatic(id));
    const right = auto.filter(correct).length;
    const blank = auto.filter(id => !answered(id)).length;
    $("score").textContent = "자동 채점 " + right + " / " + auto.length + "문항 · 오답 " + (auto.length - right - blank) + " · 미응답 " + blank + (written.length ? " · 자기 채점 " + written.length + "문항" : "");
    $("retry").disabled = mistakes().length === 0;
  }
  $("filter").options[2].disabled = state.ids.every(automatic);
  const id = ids.includes(state.current) ? state.current : ids[0];
  const item = bank[id];
  $("answer").replaceChildren();
  $("chapter").hidden = !state.submitted || !item;
  $("feedback").hidden = !item;
  $("kind").textContent = item?.t ?? "검토";
  $("number").textContent = item ? (id + 1) + "번 · " + (ids.indexOf(id) + 1) + " / " + ids.length : "";
  $("prompt").textContent = item ? item.q.replace(/^(주관식|서술형) · /,"") : "이 범위에서 검토할 문항이 없습니다.";
  $("prev").disabled = !item || ids.indexOf(id) === 0;
  $("shortcut").hidden = !study || !item;
  $("shortcut").textContent = !item ? "" : item.t === "객관식"
    ? "1–4 보기 선택 및 채점 · Space 다음 · ← 이전"
    : item.t === "단답형" ? "Enter 채점 · 채점 후 Space 다음 · ← 이전"
    : "Ctrl+Enter 예시 답안 확인 · 확인 후 Space 다음 · ← 이전";
  $("check").hidden = !study || !item;
  $("check").textContent = study && state.revealed[id] ? "정답·해설 가리기" : "정답·해설 보기";
  $("next").disabled = !item || (study && ids.indexOf(id) === ids.length - 1);
  $("next").textContent = item && ids.indexOf(id) < ids.length - 1 ? "다음 →" : study ? "마지막 문항" : state.submitted ? "결과로 이동 ↑" : "제출하고 채점";
  sourceInfo(id, item);
  if (item) {
    state.current = id;
    $("chapter").textContent = item.ch + "장";
    if (item.t === "객관식") {
      const choices = node("div", "", "choices");
      choices.setAttribute("role","radiogroup");
      choices.setAttribute("aria-labelledby","prompt");
      item.a.forEach((choice, index) => {
        const input = document.createElement("input");
        input.type = "radio"; input.name = "choice"; input.value = String(index);
        input.checked = response(id) === input.value; input.disabled = state.submitted;
        input.onchange = () => {
          update(id, input.value);
          if (study) showAnswer(id);
        };
        const label = node("label", "", "choice");
        label.append(input, node("span", (index + 1) + ". " + choice));
        choices.append(label);
      });
      $("answer").append(choices);
    } else {
      const input = document.createElement(automatic(id) ? "input" : "textarea");
      if (automatic(id)) input.type = "text";
      input.setAttribute("aria-label","답안");
      input.placeholder = item.t === "단답형" ? "답을 입력하세요" : "핵심 근거와 함께 답안을 작성하세요";
      input.value = response(id);
      input.disabled = state.submitted;
      input.oninput = () => update(id, input.value);
      $("answer").append(input);
      if (!state.submitted && item.t === "단답형" && item.b.length > 1) $("answer").append(node("p","여러 답은 쉼표로 구분하세요.","muted"));
    }
    feedback(id, item);
  }
  stats();
  tick();
}
function update(id, value) {
  state.responses[id] = value;
  save();
  stats();
  if (study && state.revealed[id]) feedback(id, bank[id]);
  $("reset").hidden = false;
}
function confirmAction(title, message, action) {
  pending = action;
  $("dialogTitle").textContent = title;
  $("dialogBody").textContent = message;
  $("confirm").returnValue = "cancel";
  $("confirm").showModal();
}
$("confirm").addEventListener("close", () => {
  if ($("confirm").returnValue === "ok") pending?.();
  pending = null;
});
function submit() {
  const blank = state.ids.filter(id => !answered(id)).length;
  const finish = () => {
    if (state.deadline) state.remaining = Math.max(0,state.deadline - Date.now());
    state.deadline = 0;
    state.submitted = true;
    filter = "all";
    save();
    render();
    $("result").scrollIntoView({block:"start"});
  };
  if (blank) confirmAction("시험을 제출할까요?", "아직 답하지 않은 문항이 " + blank + "개 있습니다.", finish);
  else finish();
}
function tick() {
  const left = state.deadline ? Math.max(0,state.deadline - Date.now()) : state.remaining;
  if (state.deadline && !left) {
    state.deadline = 0;
    state.remaining = 0;
    save();
  }
  const seconds = Math.ceil(left / 1000);
  const time = String(Math.floor(seconds/60)).padStart(2,"0") + ":" + String(seconds%60).padStart(2,"0");
  if ($("time").textContent !== time) $("time").textContent = time;
  $("timer").disabled = state.submitted || left === 0;
  const label = state.deadline ? "일시정지" : left < 3000000 && left > 0 ? "계속하기" : "타이머 시작";
  $("timer").textContent = label;
  $("timer").setAttribute("aria-label",label);
  const note = state.submitted ? "제출 시점의 남은 시간입니다." : !left ? "50분이 지났습니다. 답안은 계속 작성할 수 있습니다." : "타이머는 선택 사항입니다.";
  if ($("timeNote").textContent !== note) $("timeNote").textContent = note;
}
$("timer").onclick = () => {
  if (state.deadline) {
    state.remaining = Math.max(0,state.deadline - Date.now());
    state.deadline = 0;
  } else state.deadline = Date.now() + state.remaining;
  $("reset").hidden = false;
  save();
  tick();
};
$("prev").onclick = () => { const ids = visible(); jump(ids[ids.indexOf(state.current)-1]); };
$("next").onclick = () => {
  const ids = visible(), next = ids[ids.indexOf(state.current)+1];
  if (next !== undefined) jump(next);
  else if (state.submitted) $("result").scrollIntoView({block:"start"});
  else submit();
};
function switchMode(isStudy) {
  if (study === isStudy) return;
  save();
  study = isStudy;
  key = study ? studyKey : examKey;
  state = loadMode();
  filter = "all";
  render();
  if (study) $("prompt").focus({preventScroll:true});
}
$("studyMode").onclick = () => switchMode(true);
$("examMode").onclick = () => switchMode(false);
function showAnswer(id) {
  state.revealed[id] = true;
  save();
  feedback(id, bank[id]);
  $("check").textContent = "정답·해설 가리기";
  $("prompt").focus({preventScroll:true});
  $("feedback").scrollIntoView({block:"nearest"});
}
$("check").onclick = () => {
  const id = state.current;
  if (!state.revealed[id]) {
    showAnswer(id);
    return;
  }
  state.revealed[id] = false;
  save();
  feedback(id, bank[id]);
  $("check").textContent = "정답·해설 보기";
};
document.addEventListener("keydown", event => {
  if (!study || event.defaultPrevented || event.isComposing || event.keyCode === 229 || $("confirm").open) return;
  const id = state.current;
  const item = bank[id];
  const target = event.target;
  const textInput = target.matches?.('input[type="text"], textarea');
  const submitText = event.key === "Enter" && (item.t === "단답형" || (target.matches?.("textarea") && (event.ctrlKey || event.metaKey)));
  if (textInput) {
    if (submitText) {
      event.preventDefault();
      showAnswer(id);
    }
    return;
  }
  if (event.ctrlKey || event.metaKey || event.altKey || event.shiftKey || target.matches?.("select")) return;
  if (item.t === "객관식" && /^[1-4]$/.test(event.key)) {
    event.preventDefault();
    const index = Number(event.key) - 1;
    $("answer").querySelectorAll("input")[index].checked = true;
    update(id, String(index));
    showAnswer(id);
  } else if (event.code === "Space" && !target.matches?.("button")) {
    event.preventDefault();
    if (!event.repeat && !$("next").disabled) $("next").click();
  } else if (event.key === "ArrowLeft" && !target.matches?.("input")) {
    event.preventDefault();
    if (!event.repeat && !$("prev").disabled) $("prev").click();
  }
});
$("submit").onclick = submit;
$("filter").onchange = event => { filter = event.target.value; render(); };
$("retry").onclick = () => {
  const ids = mistakes();
  confirmAction("오답을 다시 풀까요?", "오답과 미응답 문항의 새 풀이를 시작합니다. 현재 채점 결과는 새 풀이로 바뀝니다.", () => {
    state = {...fresh(),ids,current:ids[0]}; filter = "all"; jump(ids[0]);
  });
};
$("reset").onclick = () => confirmAction("처음부터 다시 풀까요?", study ? "학습 모드에서 작성한 답안이 초기화됩니다." : "모의고사 답안과 채점 결과가 초기화됩니다.", () => {
  state = fresh(); filter = "all"; jump(0);
});
$("storageNote").textContent = storage ? "답안은 이 브라우저에 자동 저장됩니다." : "이 브라우저에서는 답안을 자동 저장할 수 없습니다.";
save();
render();
setInterval(tick, 250);
</script>
</body>
